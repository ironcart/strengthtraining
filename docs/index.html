<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lift Log</title>
  <meta name="description" content="Gym tracker for a 4-day upper/lower split with double progression, backed by Google Sheets.">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 12v8M10 9.5v13M22 9.5v13M25 12v8M10 16h12" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
      <span>Lift Log</span>
    </div>
    <button id="sync" class="icon-btn" aria-label="Refresh from sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 13a8 8 0 0 0 14.3 4.9L20 16M4 4v4h4M20 20v-4h-4"/></svg>
      <span id="sync-count" class="badge"></span>
    </button>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="main" tabindex="-1"></main>

  <div id="timer" class="timer" hidden role="timer" aria-live="polite">
    <span class="timer-label">Rest</span>
    <span id="timer-time" class="timer-time">0:00</span>
    <button id="timer-add" class="timer-btn">+30s</button>
    <button id="timer-stop" class="timer-btn" aria-label="Stop timer">✕</button>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <button data-view="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 6.5v11M18 6.5v11M21 9v6M6 12h12"/></svg><span>Train</span></button>
    <button data-view="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 4 3 5-7"/></svg><span>Progress</span></button>
    <button data-view="body"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 11a3.5 3.5 0 0 1 7 0M12 11l1.5-2"/></svg><span>Body</span></button>
    <button data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></button>
  </nav>

  <dialog id="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="row">
        <button class="btn ghost" value="cancel">Keep editing</button>
        <button class="btn primary" value="ok">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
